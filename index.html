<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>근무 기록</title>
<style>
:root{
  --bg:#0a0a0a;--sf:#111;--sf2:#161616;--bd:#222;--bd2:#2a2a2a;
  --tx:#e8e8e8;--mu:#444;--dim:#777;
  --work:#60a5fa;
  --baemin:#facc15;--coupang:#3b82f6;
  --font:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--font);background:var(--bg);color:var(--tx);
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  transition:background .5s ease;
}
body.running{background:#0a0d1a;}
/* ── TOPBAR ── */
.topbar{
  padding:14px 18px 10px;
  display:flex;gap:10px;
  border-bottom:1px solid var(--bd);
  flex-shrink:0;
}
.stat-card{
  flex:1;background:var(--sf2);border:1px solid var(--bd);
  padding:10px 12px;
}
.s-label{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:3px;}
.s-val{font-size:17px;font-weight:700;color:var(--tx);font-family:var(--mono);line-height:1;}
.s-val small{font-size:9px;font-weight:400;color:var(--dim);font-family:var(--font);}
.s-sub{font-size:8px;color:var(--mu);margin-top:3px;}

/* ── TIMER CENTER ── */
.center{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
}
.ring-wrap{width:190px;height:190px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring-wrap svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.r-bg{fill:none;stroke:var(--bd2);stroke-width:2.5;}
.r-fill{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:534;stroke-dashoffset:534;transition:stroke-dashoffset .5s,stroke .3s;}
.r-fill.pulse{animation:rpulse 2s ease-in-out infinite;}
@keyframes rpulse{0%,100%{opacity:.6}50%{opacity:1}}
.timer-btn{
  width:150px;height:150px;border-radius:50%;
  background:var(--sf2);border:1.5px solid var(--bd2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;position:relative;z-index:1;
}
.timer-btn:active{transform:scale(.95);}
.timer-btn.on{border-color:rgba(255,255,255,.3);}
.t-icon{font-size:26px;margin-bottom:5px;transition:all .2s;}
.t-time{font-size:19px;font-weight:700;font-family:var(--mono);letter-spacing:.04em;}
.t-state{font-size:9px;color:var(--mu);margin-top:3px;letter-spacing:.1em;}
/* ── 근무일과 기록 목록 ── */
.work-day{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--bd);}
.work-day p{flex:1;font-size:13px;color:var(--tx);}
#list-work{overflow-y:auto;min-height:0;}

.bottom{flex-shrink:0;border-top:1px solid var(--bd);display:flex;flex-direction:column;max-height:38vh;}
.rec-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 16px 3px;}
.rec-title{font-size:9px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;}
.rfbtn{background:none;border:1px solid var(--bd);padding:2px 8px;font-size:9px;color:var(--dim);cursor:pointer;}
.sync-st{font-size:9px;color:var(--mu);padding:0 16px 3px;}
.rec-item{padding:7px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .1s;}
.rec-item:active{background:var(--sf2);}
.rec-l{font-size:11px;color:var(--dim);font-family:var(--mono);}
.rec-r{font-size:10px;color:var(--mu);}
.rec-r.baemin{color:var(--baemin);}
.rec-r.coupang{color:var(--coupang);}
.empty{padding:16px;font-size:11px;color:var(--mu);text-align:center;}
.period-btn{
  background:none;border:1px solid var(--bd);
  padding:2px 7px;font-size:9px;color:var(--mu);cursor:pointer;transition:all .15s;
  font-family:var(--font);
}
.period-btn.active{border-color:var(--work);color:var(--work);}

/* ── OVERLAYS ── */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;opacity:0;visibility:hidden;transition:all .2s;
}
.ov.show{opacity:1;visibility:visible;}
.modal{
  width:100%;max-width:480px;background:var(--sf);
  border-top:1px solid var(--bd2);padding:20px 18px 36px;
  transform:translateY(16px);transition:transform .2s;
  max-height:90vh;overflow-y:auto;
}
.ov.show .modal{transform:translateY(0);}
.mo-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:16px;}

/* 시간 수정 */
.time-edit{display:flex;gap:8px;margin-bottom:14px;}
.time-edit-group{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.time-edit-label{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);}
.time-inp{
  background:var(--sf2);border:1px solid var(--bd2);
  padding:10px 10px;font-size:18px;font-weight:600;color:var(--tx);
  font-family:var(--mono);width:100%;outline:none;transition:border-color .15s;
  color-scheme:dark;
}
.time-inp[type=date]{font-size:13px;}
.record-tip{font-size:13px;color:#aaa;margin:10px 0;}
#recordError{color:#f87171;font-size:12px;margin-bottom:8px;}
.work-record{width:100%;background:none;border:0;text-align:left;}
.time-inp:focus{border-color:var(--dim);}

/* 버튼 행 */
.btn-row{display:flex;gap:6px;margin-top:6px;}
.sbtn{
  flex:1;padding:13px;border:none;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s;
}
.sbtn:active{opacity:.8;}
.sbtn:disabled{opacity:.25;cursor:not-allowed;}
.sbtn.primary{background:var(--tx);color:var(--bg);}
.sbtn.sec{background:var(--sf2);color:var(--dim);border:1px solid var(--bd2);}
.sbtn.danger{background:var(--sf2);color:#f87171;border:1px solid #3a1a1a;}

/* ── 세션 결과 모달 ── */
.result-modal{align-items:center;}
.result-modal .modal{border:1px solid var(--bd2);padding:24px 20px 32px;max-width:360px;}
.result-section{margin-bottom:18px;}
.result-section-title{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bd);}
.result-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;}
.result-key{font-size:11px;color:var(--dim);}
.result-val{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--tx);}
.result-val.positive{color:#4ade80;}
.result-val.negative{color:#f87171;}
.result-val.baemin{color:var(--baemin);}
.result-val.coupang{color:var(--coupang);}
.result-big{text-align:center;padding:16px 0 12px;}
.result-big-val{font-size:36px;font-weight:700;font-family:var(--mono);color:var(--tx);line-height:1;}
.result-big-label{font-size:9px;color:var(--mu);letter-spacing:.1em;margin-top:4px;}
.pace-bar{height:3px;background:var(--bd2);margin:8px 0 4px;overflow:hidden;}
.pace-fill{height:100%;background:#4ade80;transition:width .5s ease;}
.pace-fill.over{background:#facc15;}

/* ── 이어서 모달 ── */
.resume-modal{align-items:center;}
.resume-modal .modal{border:1px solid var(--bd2);padding:24px 20px 28px;max-width:340px;}
.resume-act{font-size:28px;margin-bottom:8px;}
.resume-desc{font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:20px;}
.resume-btns{display:flex;gap:8px;}
.rbtn{flex:1;padding:11px;border:1px solid var(--bd2);background:var(--sf2);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);cursor:pointer;transition:all .15s;}
.rbtn.primary{background:var(--tx);color:var(--bg);border-color:var(--tx);}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="stat-card">
    <div class="s-label" id="statWorkDayLabel">근무일 수입</div>
    <div class="s-val" id="statToday">--<small>원</small></div>
    <div class="s-sub" id="statTodaySub">-- 세션</div>
  </div>
  <div class="stat-card">
    <div class="s-label">일 수입 목표</div>
    <div class="s-val" id="statGoal">--<small>원</small></div>
    <div class="s-sub" id="statGoalSub">잔여 --</div>
  </div>
  <div class="stat-card">
    <div class="s-label">이달 근무</div>
    <div class="s-val" id="statMonth">--<small>h</small></div>
    <div class="s-sub" id="statMonthSub">목표 225h</div>
  </div>
</div>

<div class="work-day">
  <p id="workDayStatus" role="status"></p>
  <button class="sbtn sec" id="closeWorkDayBtn" type="button" onclick="closeWorkDay()" style="flex:none">근무 마감</button>
</div>

<div id="sheetSyncStatus" role="status" aria-live="polite" style="padding:6px 16px;font-size:12px;overflow-wrap:anywhere;"></div>

<!-- TIMER -->
<div class="center">
  <div class="ring-wrap" onclick="handleTimerClick()">
    <svg width="190" height="190" viewBox="0 0 190 190">
      <circle class="r-bg" cx="95" cy="95" r="85"/>
      <circle class="r-fill" id="ringFill" cx="95" cy="95" r="85"/>
    </svg>
    <div class="timer-btn" id="timerBtn">
      <div class="t-icon" id="timerIcon">⏱</div>
      <div class="t-time" id="timerTime">00:00:00</div>
      <div class="t-state" id="timerState">세션 시작</div>
    </div>
  </div>
</div>

<!-- BOTTOM -->
<div class="bottom">
      <div class="rec-hdr">
        <span class="rec-title">근무 세션</span>
        <div style="display:flex;gap:4px;align-items:center;">
          <button class="period-btn active" id="period-7" onclick="setPeriod(7)">7일</button>
          <button class="period-btn" id="period-10" onclick="setPeriod(10)">10일</button>
          <button class="period-btn" id="period-30" onclick="setPeriod(30)">30일</button>
          <button class="rfbtn" onclick="refreshWork()" aria-label="시트 동기화 다시 시도">↻</button>
        </div>
      </div>
      <div class="sync-st" id="status-work"></div>
      <div id="list-work"><div class="empty">기록 없음</div></div>
</div>

<!-- 종료 모달 -->
<div class="ov" id="endOv">
  <div class="modal">
    <div class="mo-title">기록 저장</div>
    <div class="time-edit">
      <div class="time-edit-group">
        <label class="time-edit-label" for="edit_start_date">실제 시작</label>
        <input class="time-inp" type="date" id="edit_start_date">
        <input class="time-inp" type="time" id="edit_start" aria-label="시작 시각">
      </div>
      <div class="time-edit-group">
        <label class="time-edit-label" for="edit_end_date">실제 종료</label>
        <input class="time-inp" type="date" id="edit_end_date">
        <input class="time-inp" type="time" id="edit_end" aria-label="종료 시각">
      </div>
    </div>
    <div class="time-edit">
      <div class="time-edit-group">
        <label class="time-edit-label" for="edit_work_date">근무일 (실적 합산 기준)</label>
        <input class="time-inp" type="date" id="edit_work_date">
      </div>
    </div>
    <div id="recordError" role="status"></div>

    <p class="record-tip">실적 캡처 확인 후 이 세션에 수입·건수·포인트를 입력합니다.</p>
    <div class="btn-row">
      <button class="sbtn sec" onclick="cancelEnd()">계속</button>
      <button class="sbtn danger" onclick="discardEnd()">버림</button>
      <button class="sbtn primary" id="saveBtn" onclick="saveRecord()">저장</button>
    </div>
  </div>
</div>

<div class="ov result-modal" id="closeWorkOv">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="closeWorkTitle">
    <div class="mo-title" id="closeWorkTitle">근무 마감</div>
    <label class="time-edit-label" for="closeKm">누적 계기판(km) · 선택</label>
    <input class="time-inp" type="text" inputmode="numeric" id="closeKm">
    <p class="record-tip" id="closeError" role="status"></p>
    <div class="btn-row">
      <button class="sbtn sec" onclick="hideOverlay('closeWorkOv')">취소</button>
      <button class="sbtn primary" onclick="confirmWorkClose()">마감 확인</button>
    </div>
  </div>
</div>

<div class="ov result-modal" id="startWorkOv">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="startWorkTitle">
    <div class="mo-title" id="startWorkTitle">새 세션의 근무일 선택</div>
    <div class="btn-row">
      <button class="sbtn sec" id="continueClosedBtn" onclick="startWorkSession(workDay.lastClosed.date)"></button>
      <button class="sbtn primary" id="startTodayBtn" onclick="startWorkSession(todayStr())"></button>
    </div>
    <button class="sbtn sec" style="margin-top:8px;width:100%" onclick="hideOverlay('startWorkOv')">취소</button>
  </div>
</div>

<!-- 세션 결과 모달 -->
<div class="ov result-modal" id="resultOv">
  <div class="modal">
    <div class="mo-title">세션 완료</div>

    <!-- 이번 세션 -->
    <div class="result-section">
      <div class="result-section-title">이번 세션</div>
      <div class="result-row">
        <span class="result-key">근무시간</span>
        <span class="result-val" id="res-duration">--</span>
      </div>
      <div class="result-row">
        <span class="result-key" style="color:var(--baemin);font-size:9px;">배민</span>
        <span class="result-val baemin" id="res-baemin">--</span>
      </div>
      <div class="result-row">
        <span class="result-key" style="color:var(--coupang);font-size:9px;">쿠팡</span>
        <span class="result-val coupang" id="res-coupang">--</span>
      </div>
      <div class="result-row">
        <span class="result-key">총 수입</span>
        <span class="result-val" id="res-total">--</span>
      </div>
      <div class="result-row">
        <span class="result-key">건당</span>
        <span class="result-val" id="res-per-count">--</span>
      </div>
      <div class="result-row">
        <span class="result-key">시간당</span>
        <span class="result-val" id="res-per-hour">--</span>
      </div>
    </div>

    <!-- 오늘 누적 -->
    <div class="result-section">
      <div class="result-section-title" id="res-work-date">근무일 누적</div>
      <div class="result-row">
        <span class="result-key">누적 수입</span>
        <span class="result-val" id="res-today-total">--</span>
      </div>
      <div class="result-row">
        <span class="result-key">누적 시간</span>
        <span class="result-val" id="res-today-hours">--</span>
      </div>
    </div>

    <!-- 목표 대비 -->
    <div class="result-section">
      <div class="result-section-title">목표 대비</div>
      <div class="result-big">
        <div class="result-big-val" id="res-remain">--</div>
        <div class="result-big-label">남은 금액</div>
      </div>
      <div class="pace-bar"><div class="pace-fill" id="res-pace-fill" style="width:0%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:8px;color:var(--mu);">
        <span id="res-achieve-pct">0%</span>
        <span id="res-goal-label">목표 --</span>
      </div>
      <div class="result-row" style="margin-top:8px;">
        <span class="result-key">이 페이스면</span>
        <span class="result-val" id="res-estimate">--</span>
      </div>
    </div>

    <button class="sbtn primary" onclick="closeResult()" style="width:100%;">확인</button>
  </div>
</div>

<!-- 이어서 모달 -->
<div class="ov resume-modal" id="resumeOv">
  <div class="modal">
    <div class="mo-title">진행 중인 기록</div>
    <div class="resume-act" id="resumeAct">⏱</div>
    <div class="resume-desc" id="resumeDesc"></div>
    <div class="resume-btns">
      <button class="rbtn" onclick="restartTimer()">새로 시작</button>
      <button class="rbtn primary" onclick="continueTimer()">이어서</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyd1KSpAxzkce_4MnQenji5fqarR6nxysjzZS4eZTCA7FClppLGJ96HQgdbkXwQbWVQ/exec';
const DAILY_GOAL_DEFAULT = 150000; // 목표탭에서 계산 전 기본값

let timerState = JSON.parse(localStorage.getItem('ts2') || 'null');
let timerInterval = null;
let stoppedAt;
let workDay = JSON.parse(localStorage.getItem('delivery_work_day') || '{}');
let syncingWork = false;
let syncRequested = false;
const payFields = ['baemin_basic','baemin_promo','baemin_count','coupang_basic','coupang_promo','coupang_count'];

// ── 유틸 ──
function p2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${String(d.getFullYear()).slice(2)}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`; }
function fmtTime(d){ return `${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function fmtDuration(ms){
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return `${h}:${p2(m)}`;
}
function fmtMoney(n){ return n>=10000 ? `${Math.floor(n/10000)}만${n%10000>0?(n%10000/1000).toFixed(0)+'천':''}` : n.toLocaleString(); }
function todayStr(){
  const d=new Date();
  return `${String(d.getFullYear()).slice(2)}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`;
}

function inputDate(date) {
  return date.getFullYear() + '-' + p2(date.getMonth()+1) + '-' + p2(date.getDate());
}

function legacyKey(record) {
  return JSON.stringify([record.date, String(record.startTime).padStart(5,'0'),
    String(record.endTime).padStart(5,'0'), workMinutes(record),
    ...payFields.map(field => Number(record[field]) || 0)]);
}

function mergeWorkRecords(records) {
  const byId = new Map();
  const legacy = new Map();
  for (const record of records) {
    const key = legacyKey(record);
    if (record.sessionId) byId.set(record.sessionId, record);
    else legacy.set(key, record);
  }
  for (const record of byId.values()) {
    if (!record.pending) legacy.delete(legacyKey(record));
  }
  return [...byId.values(), ...legacy.values()].sort((a, b) =>
    b.date.localeCompare(a.date) ||
    (b.startDate || b.date).localeCompare(a.startDate || a.date) ||
    b.startTime.localeCompare(a.startTime));
}

function readWorkRecords() {
  return JSON.parse(localStorage.getItem('work_recs') || '[]');
}

function storeWorkRecords(records) {
  localStorage.setItem('work_recs', JSON.stringify(mergeWorkRecords(records)));
}

function workMinutes(record) {
  const [hours, minutes] = String(record.duration || '0:00').split(':').map(Number);
  return (hours || 0) * 60 + (minutes || 0);
}

function workDayTotals(date) {
  const sessions = readWorkRecords().filter(record => record.date === date);
  return {
    income: sessions.reduce((sum, record) => sum + (Number(record.totalPay) || 0), 0),
    mins: sessions.reduce((sum, record) => sum + workMinutes(record), 0),
    count: sessions.reduce((sum, record) => sum + (Number(record.totalCount) || 0), 0),
    sessions: sessions.length
  };
}

// ── TOPBAR 업데이트 ──
function updateTopbar(){
  const date = workDay.openDate || todayStr();
  const t = workDayTotals(date);
  document.getElementById('statWorkDayLabel').textContent = date.slice(3) + ' 수입';
  document.getElementById('statToday').innerHTML=`${t.income.toLocaleString()}<small>원</small>`;
  document.getElementById('statTodaySub').textContent=`${t.sessions}세션 · ${t.count}건`;

  const goal=getDailyGoal();
  const remain=Math.max(0,goal-t.income);
  document.getElementById('statGoal').innerHTML=`${goal.toLocaleString()}<small>원</small>`;
  document.getElementById('statGoalSub').textContent=remain>0?`잔여 ${remain.toLocaleString()}`:'✓ 달성';

  const month = todayStr().slice(0,5);
  const totalMins = readWorkRecords().filter(record => record.date.startsWith(month + '.'))
    .reduce((sum, record) => sum + workMinutes(record), 0);
  const h=(totalMins/60).toFixed(1);
  document.getElementById('statMonth').innerHTML=`${h}<small>h</small>`;
  document.getElementById('statMonthSub').textContent=`목표 225h · ${Math.min(100,(totalMins/60/225*100)).toFixed(0)}%`;
}

function renderWorkDay() {
  const status = document.getElementById('workDayStatus');
  const last = workDay.lastClosed;
  status.textContent = workDay.openDate
    ? workDay.openDate + ' 근무일 열림'
    : last
      ? last.date + ' 근무 마감 완료'
      : '세션을 저장하면 근무일이 열립니다.';
  document.getElementById('closeWorkDayBtn').disabled = !workDay.openDate || !!timerState?.running;
}

function hideOverlay(id) {
  document.getElementById(id).classList.remove('show');
}

function closeWorkDay() {
  if (!workDay.openDate || timerState?.running) return;
  document.getElementById('closeWorkTitle').textContent = workDay.openDate + ' 근무 마감';
  document.getElementById('closeKm').value = '';
  document.getElementById('closeError').textContent = '';
  document.getElementById('closeWorkOv').classList.add('show');
}

function confirmWorkClose() {
  if (!workDay.openDate || timerState?.running) return;
  const input = document.getElementById('closeKm').value.trim();
  if (input && (!/^\d+$/.test(input) || !Number.isSafeInteger(Number(input)))) {
    document.getElementById('closeError').textContent = '누적 계기판을 숫자로 입력하세요.';
    return;
  }
  const close = {
    date:workDay.openDate, closeId:newSessionId(), closedAt:new Date().toISOString(), km:input
  };
  const pendingCloses = [...(workDay.pendingCloses || []), close];
  if (saveWorkDay({...workDay, openDate:'', lastClosed:close, pendingCloses})) {
    hideOverlay('closeWorkOv');
    renderWork();
    syncWorkRecords();
  }
}

function saveWorkDay(state) {
  try {
    localStorage.setItem('delivery_work_day', JSON.stringify(state));
    workDay = state;
    return true;
  } catch (err) {
    window.alert('근무일 상태를 기기에 저장할 수 없습니다.');
    return false;
  }
}

function getDailyGoal(){
  return parseInt(localStorage.getItem('daily_goal')||DAILY_GOAL_DEFAULT);
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  const oldToday = JSON.parse(localStorage.getItem('today_sessions') || '[]');
  storeWorkRecords([...oldToday, ...readWorkRecords()]);
  localStorage.removeItem('today_sessions');
  checkResume();
  refreshWork();
});

window.addEventListener('online', refreshWork);

function checkResume(){
  if(!timerState?.running)return;
  const start=new Date(timerState.startTime);
  const el=new Date()-start;
  const h=Math.floor(el/3600000),m=Math.floor((el%3600000)/60000);
  document.getElementById('resumeAct').textContent='⏱ 기록 중';
  document.getElementById('resumeDesc').textContent=`${fmtTime(start)} 시작 — ${h}h ${p2(m)}m 경과`;
  document.getElementById('resumeOv').classList.add('show');
}
function continueTimer(){
  document.getElementById('resumeOv').classList.remove('show');
  startVisual();startInterval();
}
function restartTimer(){
  document.getElementById('resumeOv').classList.remove('show');
  timerState=null;localStorage.removeItem('ts2');resetVisual();
}

// ── 타이머 ──
function handleTimerClick() {
  if (timerState?.running) {
    clearInterval(timerInterval);
    openEndModal();
    return;
  }
  if (!workDay.openDate && workDay.lastClosed) {
    document.getElementById('continueClosedBtn').textContent = workDay.lastClosed.date + ' 근무에 추가';
    document.getElementById('startTodayBtn').textContent = todayStr() + ' 새 근무';
    document.getElementById('startWorkOv').classList.add('show');
    return;
  }
  startWorkSession(workDay.openDate || todayStr());
}

function startWorkSession(workDate) {
  if (timerState?.running) return;
  hideOverlay('startWorkOv');
  timerState = {startTime:new Date().toISOString(),running:true,sessionId:newSessionId(),workDate};
  localStorage.setItem('ts2',JSON.stringify(timerState));
  startVisual();
  startInterval();
}

function startInterval(){
  clearInterval(timerInterval);
  timerInterval=setInterval(updateTimerDisplay,1000);
  updateTimerDisplay();
}
function updateTimerDisplay(){
  if(!timerState)return;
  const diff=new Date()-new Date(timerState.startTime);
  const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  document.getElementById('timerTime').textContent=`${p2(h)}:${p2(m)}:${p2(s)}`;
  const pct=Math.min(1,diff/(8*3600000));
  document.getElementById('ringFill').style.strokeDashoffset=534-(534*pct);
}
function startVisual(){
  document.getElementById('timerBtn').classList.add('on');
  document.getElementById('timerIcon').textContent='⏹';
  document.getElementById('timerState').textContent='세션 종료';
  document.getElementById('ringFill').style.stroke='#6366f1';
  document.getElementById('ringFill').classList.add('pulse');
  document.body.className='running';
  renderWorkDay();
}
function resetVisual(){
  document.getElementById('timerBtn').classList.remove('on');
  document.getElementById('timerIcon').textContent='⏱';
  document.getElementById('timerTime').textContent='00:00:00';
  document.getElementById('timerState').textContent='세션 시작';
  document.getElementById('ringFill').style.strokeDashoffset=534;
  document.getElementById('ringFill').style.stroke='';
  document.getElementById('ringFill').classList.remove('pulse');
  document.body.className='';
  renderWorkDay();
}

// ── 종료 모달 ──
function newSessionId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte =>
    byte.toString(16).padStart(2, '0')).join('');
}

function openEndModal() {
  stoppedAt = new Date();
  const start = new Date(timerState.startTime);
  document.getElementById('edit_start_date').value = inputDate(start);
  document.getElementById('edit_end_date').value = inputDate(stoppedAt);
  document.getElementById('edit_start').value = fmtTime(start);
  document.getElementById('edit_end').value = fmtTime(stoppedAt);
  const workDate = timerState.workDate || workDay.openDate;
  document.getElementById('edit_work_date').value = workDate
    ? '20' + workDate.replace(/\./g, '-')
    : inputDate(start);
  document.getElementById('recordError').textContent = '';
  document.getElementById('endOv').classList.add('show');
}

function workDateFromInput() {
  return document.getElementById('edit_work_date').value.slice(2).replace(/-/g, '.');
}

function cancelEnd(){
  document.getElementById('endOv').classList.remove('show');
  startInterval();
}
function discardEnd(){
  document.getElementById('endOv').classList.remove('show');
  timerState=null;localStorage.removeItem('ts2');
  clearInterval(timerInterval);resetVisual();
}

function readEditedTime(field, original) {
  const date = document.getElementById('edit_' + field + '_date').value;
  const time = document.getElementById('edit_' + field).value;
  if (date === inputDate(original) && time === fmtTime(original)) return original;
  return new Date(date && time ? date + 'T' + time : NaN);
}

function saveRecord() {
  if (!timerState?.running) return;
  const error = document.getElementById('recordError');
  const start = readEditedTime('start', new Date(timerState.startTime));
  const end = readEditedTime('end', stoppedAt);
  const date = workDateFromInput();
  if (!date || !(end > start)) {
    error.textContent = '근무일과 시작·종료 날짜를 확인하세요. 종료는 시작보다 늦어야 합니다.';
    return;
  }

  const record = {
    date, sessionId:timerState.sessionId || newSessionId(), pending:true, awaitingResults:true,
    startDate:fmtDate(start), endDate:fmtDate(end), startTime:fmtTime(start),
    endTime:fmtTime(end), duration:fmtDuration(end - start),
    totalPay:null, totalCount:null, points:null
  };

  try {
    storeWorkRecords([...readWorkRecords(), record]);
  } catch (err) {
    error.textContent = '기기에 기록을 저장할 수 없습니다. 저장 공간을 확인하고 다시 시도하세요.';
    return;
  }
  if (workDay.openDate !== date) saveWorkDay({...workDay, openDate: date});
  timerState = null;
  localStorage.removeItem('ts2');
  clearInterval(timerInterval);
  resetVisual();
  document.getElementById('endOv').classList.remove('show');
  renderWork();
  showResult(record);
  syncWorkRecords();
}

async function workRequest(params) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const response = await fetch(GAS_URL + '?' + new URLSearchParams(params), {
      signal: controller.signal, cache: 'no-store'
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();
    if (result.error) throw new Error(result.error);
    return result;
  } finally {
    clearTimeout(timeout);
  }
}

async function syncWorkRecords() {
  if (syncingWork) {
    syncRequested = true;
    return;
  }
  syncingWork = true;
  const status = document.getElementById('sheetSyncStatus');
  try {
    do {
      syncRequested = false;
      const pending = readWorkRecords().filter(record => record.pending);
      const closes = workDay.pendingCloses || [];
      if (!pending.length && !closes.length) break;
      status.textContent = '시트 전송 중 · ' + (pending.length + closes.length) + '건';
      for (const {pending: ignored, ...record} of pending) {
        const result = await workRequest({action:'saveWorkSessionV3', ...record});
        if (!result.saved || result.sessionId !== record.sessionId) {
          throw new Error('저장 확인 실패');
        }
        storeWorkRecords(readWorkRecords().map(current =>
          current.sessionId === record.sessionId ? {...current, pending:false} : current));
        renderWork();
      }
      for (const close of closes) {
        const result = await workRequest({action:'saveDeliveryClose', ...close});
        if (!result.saved || result.closeId !== close.closeId) throw new Error('마감 저장 확인 실패');
        const pendingCloses = (workDay.pendingCloses || []).filter(item => item.closeId !== close.closeId);
        if (!saveWorkDay({...workDay, pendingCloses})) throw new Error('기기 상태 저장 실패');
      }
      status.textContent = '시트 저장 완료';
    } while (syncRequested);
  } catch (err) {
    const count = readWorkRecords().filter(record => record.pending).length + (workDay.pendingCloses || []).length;
    status.textContent = '기기에 저장됨 · 시트 전송 대기 ' + count + '건 · ↻ 다시 시도';
    console.warn('근무 기록 동기화 실패', err);
  } finally {
    syncingWork = false;
  }
}

// ── 세션 결과 ──
function showResult(rec){
  const dur=rec.duration;
  const parts=dur.split(':');
  const hours=parseInt(parts[0]||0)+parseInt(parts[1]||0)/60;
  const bTotal=(Number(rec.baemin_basic)||0)+(Number(rec.baemin_promo)||0);
  const cTotal=(Number(rec.coupang_basic)||0)+(Number(rec.coupang_promo)||0);
  const total=Number(rec.totalPay)||0;
  const count=Number(rec.totalCount)||0;
  const perCount=count>0?Math.round(total/count):0;
  const perHour=hours>0?Math.round(total/hours):0;

  document.getElementById('res-duration').textContent=dur;
  document.getElementById('res-baemin').textContent=bTotal>0?bTotal.toLocaleString()+'원':'-';
  document.getElementById('res-coupang').textContent=cTotal>0?cTotal.toLocaleString()+'원':'-';
  document.getElementById('res-total').textContent=rec.awaitingResults ? '실적 입력 대기' : total.toLocaleString()+'원';
  document.getElementById('res-per-count').textContent=perCount>0?perCount.toLocaleString()+'원':'-';
  document.getElementById('res-per-hour').textContent=perHour>0?perHour.toLocaleString()+'원':'-';

  const t = workDayTotals(rec.date);
  document.getElementById('res-work-date').textContent = rec.date + ' 근무일 누적';
  const todayH=(t.mins/60).toFixed(1);
  document.getElementById('res-today-total').textContent=t.income.toLocaleString()+'원';
  document.getElementById('res-today-hours').textContent=todayH+'h · '+t.count+'건';

  const goal=getDailyGoal();
  const remain=Math.max(0,goal-t.income);
  const pct=Math.min(100,t.income/goal*100);
  document.getElementById('res-remain').textContent=remain>0?remain.toLocaleString()+'원':'달성!';
  document.getElementById('res-remain').className='result-big-val'+(remain<=0?' positive':'');
  document.getElementById('res-pace-fill').style.width=pct+'%';
  document.getElementById('res-pace-fill').className='pace-fill'+(pct>=100?' over':'');
  document.getElementById('res-achieve-pct').textContent=pct.toFixed(0)+'%';
  document.getElementById('res-goal-label').textContent='목표 '+goal.toLocaleString();

  if(remain>0 && t.mins>0 && t.income>0){
    const ratePerMin=t.income/t.mins;
    const minsNeeded=Math.ceil(remain/ratePerMin);
    const h=Math.floor(minsNeeded/60),m=minsNeeded%60;
    document.getElementById('res-estimate').textContent=`약 ${h>0?h+'h ':''}${m}분 더 필요`;
  } else if(remain<=0){
    document.getElementById('res-estimate').textContent='목표 달성!';
  } else {
    document.getElementById('res-estimate').textContent='-';
  }

  document.getElementById('resultOv').classList.add('show');
}
function closeResult(){document.getElementById('resultOv').classList.remove('show');}

// ── 기록 렌더링 ──
let currentPeriod = 7;
let loadingWork = false;

function renderWork() {
  updateTopbar();
  renderWorkDay();
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - currentPeriod + 1);
  const date = fmtDate(cutoff);
  const records = readWorkRecords().filter(record => record.date >= date);
  const list = document.getElementById('list-work');
  list.replaceChildren();
  if (!records.length) {
    list.textContent = '기록 없음';
    return;
  }
  records.forEach(record => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'rec-item work-record';
    const dates = record.startDate && record.endDate && (record.startDate !== record.date || record.endDate !== record.date)
      ? ' · 실제 ' + record.startDate + ' → ' + record.endDate : '';
    const label = document.createElement('span');
    label.className = 'rec-l';
    label.textContent = record.date + ' 근무 · ' + record.startTime + '–' + record.endTime + dates +
      (record.pending ? ' · 전송 대기' : '');
    const amount = document.createElement('span');
    amount.className = 'rec-r';
    amount.textContent = record.awaitingResults
      ? '실적 입력 대기'
      : (Number(record.totalPay) || 0).toLocaleString() + '원';
    item.append(label, amount);
    item.addEventListener('click', () => showResult(record));
    list.append(item);
  });
}

function setPeriod(days) {
  currentPeriod = days;
  document.querySelectorAll('.period-btn').forEach(button =>
    button.classList.toggle('active', button.id === 'period-' + days));
  renderWork();
}

async function refreshWork() {
  renderWork();
  syncWorkRecords();
  if (loadingWork) return;
  loadingWork = true;
  const status = document.getElementById('status-work');
  try {
    status.textContent = '시트 불러오는 중…';
    const data = await workRequest({action:'loadWorkSessions', days:31});
    if (!Array.isArray(data.records)) throw new Error('Invalid records');
    const remote = data.records.map(record => ({...record, pending:false}));
    storeWorkRecords([...readWorkRecords(), ...remote]);
    renderWork();
    status.textContent = '시트 기록을 불러왔습니다';
  } catch (err) {
    status.textContent = '시트 연결 실패 · 기기에 저장된 기록 표시';
  } finally {
    loadingWork = false;
  }
}
</script>
